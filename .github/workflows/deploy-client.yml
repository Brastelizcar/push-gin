# Publica la PÁGINA del juego (carpeta client/) en GitHub Pages cada vez que subes cambios.
name: Publicar página (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - "client/**"
      - "src/logic/**"
      - ".github/workflows/deploy-client.yml"
  workflow_dispatch:        # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias del cliente
        working-directory: client
        run: npm install
      - name: Compilar
        working-directory: client
        run: npm run build
        env:
          # La página vive en https://USUARIO.github.io/NOMBRE-DEL-REPO/
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
